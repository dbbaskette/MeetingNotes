# Deploys the marketing/landing page in site/ to GitHub Pages at
# https://dbbaskette.github.io/MeetingNotes/ whenever it changes on main.
# The page is fully self-contained (no build step) — upload and deploy.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do NOT cancel an in-flight deploy — GitHub's first-ever
# Pages provisioning for a repo can take 15-20 min, and cancelling mid-poll just
# restarts that clock.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # First run flips the repo's Pages source to "GitHub Actions"
          # so no manual Settings step is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # First-ever Pages provisioning for a repo can outlast the action's
          # default 10-min poll. Give it 25 min so a single run rides through.
          timeout: 1500000
