# Publishes the landing page in site/ to the gh-pages branch, which GitHub
# Pages serves at https://dbbaskette.github.io/MeetingNotes/ (Pages source is
# set to the gh-pages branch, build_type=legacy).
#
# Why not actions/deploy-pages: on this repo that pipeline hung indefinitely in
# `deployment_queued` on first provisioning. The classic branch build is
# reliable — but pushing the branch alone didn't auto-trigger a build here, so
# we also request one explicitly via the API.
name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # push the gh-pages branch
  pages: write      # request a Pages build

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # peaceiris drops a .nojekyll automatically; keep the raw HTML as-is.
          enable_jekyll: false
          commit_message: "site: publish ${{ github.sha }}"

      - name: Trigger a Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The branch push doesn't reliably auto-trigger a build on this repo,
          # so request one and wait for it to finish.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          for i in $(seq 1 30); do
            s=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status' 2>/dev/null || echo "")
            echo "pages build status: $s"
            [ "$s" = "built" ] && exit 0
            [ "$s" = "errored" ] && { gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.error.message'; exit 1; }
            sleep 10
          done
