<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetingNotes</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mn-theme');
          var dark = t === 'dark' || (t !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <!-- Dev-only shim: when running under `vite` (browser preview) the Electron
         preload hasn't set window.api, so every IPC call throws and the whole
         tree unmounts. Install an inert stub so designers can inspect the UI
         in a regular browser. In a packaged Electron build, the preload's
         contextBridge.exposeInMainWorld has already set window.api before this
         script runs, so the `if (!window.api)` guard is a no-op. -->
    <script>
      if (!window.api) {
        const noop = () => {};
        const asyncNoop = async () => {};
        // Dev-preview sample data so designers see populated rows. Electron
        // runs never hit this branch (preload sets window.api before this
        // script executes), so this can't leak into production.
        window.__mnDevMeetings = [
          { id: 'p1', slug: 'p1', title: 'recording-20260421-143000-abc123', startedAt: '2026-04-21T14:30:00', durationS: 1800, pipelineStage: 'discovered', status: 'pending', stageStartedAt: null, skipSpeakerId: false, unidentifiedCount: 0, actionItemsCount: 0, speakers: [] },
          { id: 'p2', slug: 'p2', title: 'recording-20260421-150500-def456', startedAt: '2026-04-21T15:05:00', durationS: 2700, pipelineStage: 'discovered', status: 'pending', stageStartedAt: null, skipSpeakerId: false, unidentifiedCount: 0, actionItemsCount: 0, speakers: [] },
          { id: 'b', slug: 'b', title: 'Design critique — detail view', startedAt: '2026-04-20T11:00:00', durationS: 2100, pipelineStage: 'awaiting_speaker_id', status: 'awaiting_user', stageStartedAt: null, skipSpeakerId: false, unidentifiedCount: 2, actionItemsCount: 0, speakers: [] },
          { id: 'live', slug: 'live', title: 'Sync with design', startedAt: '2026-04-20T09:00:00', durationS: 600, pipelineStage: 'diarizing', status: 'processing', stageStartedAt: new Date(Date.now() - 90000).toISOString(), skipSpeakerId: false, unidentifiedCount: 0, actionItemsCount: 0, speakers: [] },
          { id: 'c', slug: 'c', title: 'Whisper misfire', startedAt: '2026-04-20T14:00:00', durationS: 400, pipelineStage: 'transcribing', status: 'failed', stageStartedAt: null, skipSpeakerId: false, unidentifiedCount: 0, actionItemsCount: 0, speakers: [] },
          { id: 'a', slug: 'a', title: 'Quarterly planning review', startedAt: '2026-04-20T08:00:00', durationS: 3200, pipelineStage: 'done', status: 'done', stageStartedAt: null, skipSpeakerId: false, unidentifiedCount: 0, actionItemsCount: 9, speakers: [{localLabel:'A', rosterId:'r', displayName:'Alice', confidence: 0.95},{localLabel:'B', rosterId:'r', displayName:'Bob', confidence: 0.95}] },
          { id: 'd', slug: 'd', title: 'Standup notes', startedAt: '2026-04-19T09:00:00', durationS: 900, pipelineStage: 'done', status: 'done', stageStartedAt: null, skipSpeakerId: false, unidentifiedCount: 0, actionItemsCount: 3, speakers: [{localLabel:'A', rosterId:'r', displayName:'Alice', confidence: 0.95}] },
        ];
        window.api = {
          meetings: {
            list: async () => window.__mnDevMeetings || [],
            get: async () => null,
            rename: asyncNoop, delete: asyncNoop,
            undoDelete: async () => false,
            start: asyncNoop, startMany: async () => 0, rerun: asyncNoop,
            setSkipSpeakerId: asyncNoop, continueFromSpeakerId: asyncNoop,
            saveSummary: async () => '',
            onAdded: () => noop,
          },
          recording: {
            listSources: async () => [],
            start: async () => ({ sessionId: 'dev' }),
            stop: asyncNoop, state: async () => 'idle',
            onLevel: () => noop, onStateChange: () => noop,
          },
          speakers: {
            list: async () => [], confirm: async () => '',
            rename: asyncNoop, sample: async () => null,
            assign: asyncNoop, unlink: asyncNoop,
          },
          actionItems: {
            setStatus: asyncNoop,
            update: asyncNoop, delete: asyncNoop, create: asyncNoop,
          },
          onboarding: {
            listWhisperModels: async () => [],
            installWhisperModel: asyncNoop,
            saveHfToken: asyncNoop,
            openExternal: asyncNoop,
          },
          search: { query: async () => [] },
          exports: { run: async () => ({}) },
          export: { run: async () => ({}) },
          dialog: { save: async () => null },
          settings: {
            // onboardedAt truthy so the preview opens straight to Library.
            // For previewing the wizard itself, edit this line to `null`.
            getAll: async () => ({ userName: '', autoDetectMeetings: false, onboardedAt: '2026-01-01T00:00:00Z', theme: 'system' }),
            set: asyncNoop,
          },
          models: { list: async () => [] },
          permissions: {
            audio: async () => ({ mic: 'granted', audioCapture: 'granted' }),
            requestMic: async () => true,
            micStatus: async () => 'granted',
          },
          meetingDetector: { onDetected: () => noop, dismiss: asyncNoop },
          // Pipeline queue controls (pause/resume/clear) — added with the
          // queue banner. The shim returns a quiet idle status.
          pipeline: {
            status: async () => ({ paused: false, currentId: null, queueLength: 0, queueIds: [] }),
            pause: asyncNoop,
            resume: asyncNoop,
            clear: async () => ({ cleared: [] }),
            onStatusChange: () => noop,
          },
          // Settings "Test connection" probes.
          llm: {
            detectProviders: async () => ({ lmStudio: { binary: false, running: false }, ollama: { binary: false, running: false } }),
            probe: async () => ({ ok: true, models: [] }),
          },
          stt: { probe: async () => ({ ok: true }) },
          // Weekly view IPC. Returns empty so the Weekly view paints
          // its empty-week state cleanly when previewed in the browser.
          weekly: {
            get: async () => ({}),
            getStructured: async () => ({
              isoYear: 2026, isoWeek: 17,
              rangeStart: '', rangeEnd: '',
              totalDurationS: 0, meetings: [], openActionGroups: [],
              openActionCount: 0, inProgress: false, hasFreshCache: false,
            }),
            getNarrative: async () => ({ narrative: '', decisions: [], generatedAt: '', fromCache: false }),
            regenerate: async () => ({}),
            exportMarkdown: async () => ({ path: null, markdown: '' }),
          },
          // Drag-and-drop import + transcript export.
          app: { getVersion: async () => '0.0.0-dev' },
          google: {
            authStart: async () => ({ email: null }),
            authStatus: async () => ({ email: null, hasCredentials: false, signedIn: false }),
            signOut: asyncNoop,
          },
          logs: {
            tail: async () => ({ path: '', entries: [] }),
            reveal: asyncNoop,
          },
          webhook: { testSend: async () => ({ ts: new Date().toISOString(), status: null, error: 'dev-shim' }) },
          on: () => noop,
          onMenuAction: () => noop,
          onOpenMeeting: () => noop,
          onAutoRecordingStarted: () => noop,
        };
        // Top-level extras that don't fit cleanly into a sub-namespace.
        window.api.meetings.importDropped = async () => ({ imported: 0, skipped: [] });
        window.api.meetings.exportTranscript = async () => ({ path: null });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
